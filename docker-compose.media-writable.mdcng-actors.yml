services:
  mujing-nas:
    environment:
      MUJING_MDCNG_DATA_DIR: /imports/mdcng
    volumes:
      - type: bind
        source: ${MEDIA_ROOT:?Set MEDIA_ROOT in .env before enabling the writable single-media MDCNG overlay.}
        target: /media
        read_only: false
      - type: bind
        source: ${MDCNG_DATA_ROOT:?Set MDCNG_DATA_ROOT to MDCNG config/data in .env.}
        target: /imports/mdcng
        read_only: true
